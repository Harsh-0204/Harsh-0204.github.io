<style>
:root{--bg:#0f172a;--fg:#e2e8f0;--muted:#9aa8bf;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.11);--a1:#818cf8;--a2:#a78bfa;--a3:#34d399;--btnfg:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f1f5f9;--fg:#0f172a;--muted:#475569;--glass:rgba(255,255,255,.75);--line:rgba(15,23,42,.13);--a1:#4338ca;--a2:#6d28d9;--a3:#047857;--btnfg:#fff}
html{scroll-behavior:smooth;scroll-padding-top:calc(5rem + env(safe-area-inset-top,0px));height:auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,.disp{font-family:Sora,Inter,system-ui,sans-serif}
.muted{color:var(--muted)}.a1{color:var(--a1)}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lift{transition:transform .25s,box-shadow .25s,border-color .25s}
.lift:hover{transform:translateY(-5px) scale(1.012);border-color:var(--a1);box-shadow:0 18px 40px -16px color-mix(in srgb,var(--a1) 55%,transparent)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.5rem;padding:.72rem 1.25rem;border-radius:12px;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--glass);transition:transform .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);border-color:var(--a1)}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 0 24px -4px rgba(129,140,248,.7)}
.btn-p:hover{box-shadow:0 0 36px -2px rgba(167,139,250,.95)}
.btn-p::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn-p:hover::after{left:130%}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .7rem;border-radius:999px;font-size:.8rem;font-weight:500;border:1px solid var(--line);background:var(--glass)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--a1))}
.badge{font-size:.72rem;font-weight:600;padding:.12rem .6rem;border-radius:999px;color:var(--a3);border:1px solid color-mix(in srgb,var(--a3) 50%,transparent)}
.nav a{color:var(--muted);transition:color .15s}.nav a:hover,.nav a.on{color:var(--a1)}
a:focus-visible,button:focus-visible{outline:2px solid var(--a1);outline-offset:3px;border-radius:8px}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(60px,40px) scale(1.18)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.bob{animation:bob 5s ease-in-out infinite}.pop{animation:pop .4s ease both}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--a3);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line)}
.node{position:absolute;left:-9px;top:.45rem;width:16px;height:16px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 4px var(--bg),0 0 18px 3px var(--a1)}
#stats>*{border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.fbtn[aria-pressed="true"]{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.3s;z-index:80;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>

</main>

<footer class="max-w-6xl mx-auto px-5 py-8 text-sm muted flex flex-wrap justify-between gap-3" style="border-top:1px solid var(--line)"><span id="foot-l"></span><span>Built with HTML, Tailwind CSS and vanilla JS</span></footer>

<script>
/* ============ EDIT YOUR DETAILS HERE ============ */

};
/* ================================================ */

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ico = {
  gh: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.300-1.300-1.700-1.300-1.700-1-.7.1-.7.1-.7 1.100.1 1.700 1.200 1.700 1.200 1 1.700 2.700 1.200 3.300.9.1-.7.4-1.200.7-1.500-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .3.2.7.8.6A11.500 11.500 0 0 0 12 .5z"/></svg>',
  in: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M4.500 3a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5zM2 9.500h5V22H2zM9.500 9.500h4.800v1.700c.7-1.200 2.200-2 4-2 3.500 0 4.200 2.300 4.200 5.300V22h-5v-6.300c0-1.500 0-3.200-2-3.200s-2.200 1.500-2.200 3.100V22h-5z"/></svg>',
  mail: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  dl: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>',
  ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  cp: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
};
const ext = (u, inner, cls = "btn", extra = "") => `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener" ${extra}>${inner}</a>`;

/* Header & hero */
const nav = [["about", "About"], ["skills", "Skills"], ["projects", "Projects"], ["journey", "Education"], ["contact", "Contact"]];
const navHtml = nav.map(([id, l]) => `<a href="#${id}">${l}</a>`).join("");
$("#nav").innerHTML = navHtml; $("#mnav").innerHTML = navHtml;
$("#brand").innerHTML = `<span class="grad">${esc(DATA.name.split(" ")[0])}</span>.dev`;

/* Typing effect */
const typed = $("#typed"), calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (calm) typed.textContent = DATA.roles[0];
else { let r = 0, i = 0, del = false;
  (function tick() {
    const w = DATA.roles[r];
    i += del ? -1 : 1; typed.textContent = w.slice(0, i);
    let d = del ? 35 : 75;
    if (!del && i === w.length) { del = true; d = 1500; }
    else if (del && i === 0) { del = false; r = (r + 1) % DATA.roles.length; d = 350; }
    setTimeout(tick, d);
  })(); }

/* Stats */
$("#stats").innerHTML = DATA.stats.map((s) => {
  const big = s.to ? `<span data-to="${s.to}">0</span>` : esc(s.text);
  const inner = `<p class="disp text-3xl font-extrabold grad">${big}</p><p class="text-sm muted mt-1">${esc(s.label)}</p>`;
  return s.href ? `<a href="${esc(DATA[s.href])}" target="_blank" rel="noopener" class="p-6 text-center block hover:bg-white/5 transition">${inner}</a>` : `<div class="p-6 text-center">${inner}</div>`;
}).join("");
function count(el) {
  const to = parseFloat(el.dataset.to), dec = (el.dataset.to.split(".")[1] || "").length;
  if (calm) { el.textContent = to.toFixed(dec); return; }
  const t0 = performance.now();
  (function f(t) { const p = Math.min((t - t0) / 1100, 1); el.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(dec); if (p < 1) requestAnimationFrame(f); })(t0);
}
new IntersectionObserver((es, o) => es.forEach((e) => { if (e.isIntersecting) { e.target.querySelectorAll("[data-to]").forEach(count); o.disconnect(); } }), { threshold: .4 }).observe($("#stats"));

/* Skills */
$("#skill-grid").innerHTML = DATA.skills.map((g) => `
  <div class="glass lift p-5"><div class="flex items-center justify-between mb-4"><h3 class="font-semibold">${esc(g.t)}</h3><span class="badge">${esc(g.tag)}</span></div>
  <div class="flex flex-wrap gap-2">${g.s.map((s) => `<span class="pill" style="--c:${g.c}"><i></i>${esc(s)}</span>`).join("")}</div></div>`).join("");

/* Projects + filters */
let cur = "All";
function drawProjects() {
  $("#filters").innerHTML = DATA.filters.map((f) => `<button class="btn fbtn !py-2 !px-4 text-sm" aria-pressed="${f === cur}" data-f="${esc(f)}">${esc(f)}</button>`).join("");
  $("#project-grid").innerHTML = DATA.projects.filter((p) => cur === "All" || p.cats.includes(cur)).map((p, i) => `
    <article class="glass lift pop p-6 flex flex-col" style="animation-delay:${i * 60}ms">
      <div class="flex items-start justify-between gap-3"><h3 class="text-xl font-bold">${esc(p.title)}</h3><span class="text-xs muted whitespace-nowrap mt-1.5">${esc(p.when)}</span></div>
      <ul class="mt-4 space-y-2.5 text-[.93rem] muted flex-1">
        <li><b class="a1">Built:</b> ${esc(p.built)}</li>
        <li><b class="a1">Solves:</b> ${esc(p.solves)}</li>
        <li><b class="a1">Outcome:</b> ${esc(p.outcome)}</li>
      </ul>
      <div class="flex flex-wrap gap-2 mt-5">${p.stack.map((s) => `<span class="pill">${esc(s)}</span>`).join("")}</div>
      ${(p.demo || p.repo) ? `<div class="flex gap-3 mt-5">${p.demo ? ext(p.demo, "Live demo " + ico.ext, "btn btn-p !py-2") : ""}${p.repo ? ext(p.repo, ico.gh + " GitHub code", "btn !py-2") : ""}</div>` : ""}
    </article>`).join("");
}
$("#filters").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { cur = b.dataset.f; drawProjects(); } });
drawProjects();

/* Timeline */
$("#timeline").innerHTML = DATA.timeline.map((t) => `
  <li class="relative pl-8"><span class="node"></span>
    <p class="text-sm font-semibold a1">${esc(t.when)}</p><h3 class="text-lg font-semibold">${esc(t.title)}</h3>
    <p class="muted text-sm">${esc(t.where)}</p><p class="muted mt-1 max-w-prose">${esc(t.note)}</p></li>`).join("");

/* Contact + toast */
$("#email-line").textContent = DATA.email;
$("#contact-links").innerHTML =
  `<button id="copy" class="btn btn-p">${ico.cp} Copy email</button>` +
  `<a class="btn" href="mailto:${esc(DATA.email)}">${ico.mail} Send email</a>` +
  ext(DATA.linkedin, ico.in + " LinkedIn") + ext(DATA.leetcode, "LeetCode " + ico.ext) +
  (DATA.github ? ext(DATA.github, ico.gh + " GitHub") : "");
$("#foot-l").textContent = "© " + new Date().getFullYear() + " " + DATA.name + ", " + DATA.location;
const toast = $("#toast"); let tt;
function say(m) { toast.textContent = m; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 2200); }
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(DATA.email); say("Email copied to clipboard"); }
  catch (e) {
    try { const a = document.createElement("textarea"); a.value = DATA.email; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); say(ok ? "Email copied to clipboard" : "Copy failed. Email: " + DATA.email); }
    catch (e2) { say("Copy failed. Email: " + DATA.email); }
  }
});

/* Theme (dark first), menu, active nav */
const root = document.documentElement;
function theme(t) { root.setAttribute("data-theme", t); root.classList.toggle("dark", t === "dark"); }
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
theme(saved === "light" ? "light" : "dark");
$("#theme").addEventListener("click", () => { const n = root.dataset.theme === "dark" ? "light" : "dark"; theme(n); try { localStorage.setItem("theme", n); } catch (e) {} });
const menu = $("#menu"), mnav = $("#mnav");
function closeM() { mnav.classList.add("hidden"); mnav.classList.remove("flex"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => { const open = mnav.classList.contains("hidden"); mnav.classList.toggle("hidden", !open); mnav.classList.toggle("flex", open); menu.setAttribute("aria-expanded", open); });
mnav.addEventListener("click", (e) => { if (e.target.tagName === "A") closeM(); });
const links = [...document.querySelectorAll("#nav a")];
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
nav.forEach(([id]) => io.observe(document.getElementById(id)));
</script>
</body>
</html>
